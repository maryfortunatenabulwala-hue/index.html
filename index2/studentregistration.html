<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STUDENT REGISTRATION</title> 
    <link rel="stylesheet" href="style1.css">
</head>
<body> 
    <Table width="70%" margin="auto">
        <tr>
            <th>   
                Student Registration Form
            </th>
        </tr> 
        <tr>
            <td>
                Name: 
            </td> 
            <td> 
                <input type="text" placeholder="Enter full name">
            </td>
        </tr> 
        <tr>
            <td>
                Father's Name: 
            </td> 
            <td>
                <input type="text">
            </td>
        </tr> 
        <tr>
            <td>
                Mother' Name:
            </td> 
            <td>
                <input type="text">
            </td>
        </tr> 
        <tr>
            <td>
                Phone Number:
            </td> 
            <td>
                <input type="text" placeholder="017xxxxxxx">
            </td>
        </tr> 
        <tr>
            <td>
                Email:
            </td> 
            <td>
                <input type="email" placeholder="sample@exanple.com">
            </td>
        </tr> 
        <tr>
            <td>
                Gender:
            </td>  
            <td>
                <input type="radio"> Male 
                <input type="radio"> Female 
                <input type="radio"> Other
            </td>
        </tr> 
        <tr>
            <td>
                Date of Birth: 
            </td> 
            <td> 
                <input type="text"> 
                <input type="text"> 
                <input type="text"> 
                <td>
                    (dd-mm-yyy)
                </td>
                 

            </td>
        </tr> 
        <tr>
            <td>
                Address:
            </td> 
            <td>
                <input type="text" placeholder="Street:    House:     Road:">
            </td>
        </tr> 
        <tr>
            <td>
                Blood Group: 
            </td> 
            <td>
                <select>
                    <option>Select</option>
                    <option>A+</option> 
                    <option>A-</option> 
                    <option>B+</option> 
                    <optiion>B-</option> 
                    <option>O</option> 
                    <option>AB</option>
                </select>
            </td>
        </tr> 
        <tr>
            <td>
                Department: 
            </td> 
            <td>
                <input type="radio">CSE 
                <input type="radio">EEE 
                <input type="radio">BBA
            </td>
        </tr> 
        <tr>
            <td>
                Course:
            </td> 
            <td>
                <input type="button">C 
                <input type="button">C++ 
                <input type="button">Java 
                <input type="button">AI 
                <input type="button">Machine Learning
                <input type="button">Robotics
            </td>

        </tr> 
        <tr>
            <td>
                Photo:
            </td> 
            <td>
               <input type="file" placeholder=" Choose file">
            </td>
        </Table> <br> <br> <br> <br>
          <table>
        <tr>
            <td> 
                <input type="submit">
            </td> 
            <td>
                <input type="reset">
            </td>
        </tr>
    </table>
       
    
    
</body>
</html>
